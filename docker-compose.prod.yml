services:
  # 1. Production PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: nexus_hrms_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-pratha_ems}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-pratha_ems}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hrms_network

  # 2. Redis Cache & Real-Time Pub/Sub Message Broker
  redis:
    image: redis:7-alpine
    container_name: nexus_hrms_redis_prod
    restart: always
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hrms_network

volumes:
  postgres_prod_data:
  redis_prod_data:

networks:
  hrms_network:
    driver: bridge
